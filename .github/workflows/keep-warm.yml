name: Keep-warm Render free tier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: none

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake frontend
        run: curl -fsS -o /dev/null -w "frontend:%{http_code}\n" https://sentinel-frontend-dhkcs.onrender.com/ || true
      - name: Wake backend
        run: curl -fsS -o /dev/null -w "backend:%{http_code}\n" https://sentinel-backend-dhkcs.onrender.com/health || true