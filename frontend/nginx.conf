server {
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Keep the /api prefix — all FastAPI routers are mounted under /api.
        # (A trailing slash on proxy_pass would strip it and 404 every call.)
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Render's edge is CDN-fronted (Cloudflare): without SNI the TLS
        # handshake to the upstream host fails with alert 40 -> 502.
        proxy_ssl_server_name on;
        # Free-tier backend sleeps after ~15 min idle and can take up to
        # ~60s to wake; give the proxy enough headroom so cold starts do
        # not surface as 502 Bad Gateway to the browser.
        proxy_connect_timeout 80s;
        proxy_send_timeout 80s;
        proxy_read_timeout 80s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
