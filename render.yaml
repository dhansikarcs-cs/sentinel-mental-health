databases:
  - name: sentinel-db-dhkcs
    databaseName: sentinel
    user: sentinel
    plan: free
    region: oregon

services:
  - type: web
    name: sentinel-backend-dhkcs
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness probe used by Render to mark the deploy healthy.
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db-dhkcs
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sentinel-frontend-dhkcs.onrender.com
      - key: RUN_WORKERS
        value: "false"
      - key: RATE_LIMIT_BACKEND
        value: "db"
      - key: WS_PUBSUB
        value: "auto"
      - key: COOKIE_SECURE
        value: "true"
      # ── Encryption (journals at rest) ──
      # Set once and NEVER change — data becomes undecryptable if it changes.
      - key: ENCRYPTION_PASSPHRASE
        sync: false
      - key: ENCRYPTION_SALT
        sync: false
      - key: ENCRYPTION_REQUIRED
        value: "true"
      # ── Azure AI Foundry (journal summaries) ──
      - key: AZURE_AI_ENDPOINT
        sync: false
      - key: AZURE_AI_KEY
        sync: false
      - key: AZURE_DEPLOYMENT
        value: gpt-5.4-mini
      - key: ALLOW_CLOUD_AI
        value: "true"
      # ── Email / crisis escalation ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRISIS_HELPLINE_EMAIL
        sync: false
      - key: TRUSTEE_LINK_SECRET
        generateValue: true
      - key: SENTINEL_ACK_LINK
        value: https://sentinel-frontend-dhkcs.onrender.com/trustee

  - type: web
    name: sentinel-frontend-dhkcs
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://sentinel-backend-dhkcs.onrender.com
