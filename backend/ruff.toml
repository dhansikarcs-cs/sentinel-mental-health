target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "TCH"]
# Project style choices kept for readability/history:
#   C408 — dict() calls are intentional house style
#   E741 — single-letter loop vars (l/i) used in stats-heavy clinical code
#   B007/SIM102/SIM105/C405 — cosmetic micro-refactors
ignore = ["E501", "B008", "UP007", "C408", "E741", "B007", "SIM102", "SIM105", "C405"]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"seed_demo.py" = ["E402"]
"seed_clinic.py" = ["E402"]
"azure_integration_check.py" = ["E402"]
"alembic/env.py" = ["E402"]
"conftest.py" = ["E402", "F401", "SIM105"]
